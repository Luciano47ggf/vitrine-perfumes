<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rafael · Perfumaria masculina. Fragrâncias de alto padrão, pedidos pelo WhatsApp.">
<meta name="theme-color" content="#f6f6f3">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Rafael Perfumaria</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Layout: perfumaria masculina clara — destaque em carrossel (texto | frasco), catálogo em grade, painel de uma tela.
   Tema único claro, escolhido de propósito (pedido do cliente: cores claras). */
:root{
  color-scheme:light;
  --porcelain:#f6f6f3; --white:#ffffff; --mist:#ecebe6; --stone:#e2e1db;
  --ink:#16191d; --ink-2:#5b6066; --ink-3:#8b9096; --line:#dddcd5;
  --bronze:#8a6b45; --ok:#2f6b4f; --danger:#a33a32; --wa:#25d366;
  --f-display:"Marcellus","Times New Roman",serif;
  --f-body:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--porcelain);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--ink);color:var(--porcelain)}
:focus-visible{outline:2px solid var(--bronze);outline-offset:3px}
.wrap{max-width:1152px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:640px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.caps{font-size:11px;font-weight:500;letter-spacing:.26em;text-transform:uppercase}
.disp{font-family:var(--f-display);font-weight:400}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{opacity:0;transform:translateY(32px) scale(.985)}to{opacity:1;transform:none}}
@keyframes settle{from{transform:scale(1.08)}to{transform:scale(1)}}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rise{animation:rise .7s var(--ease) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* barra da prévia */
.pv{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--ink);color:var(--porcelain)}
.pv .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:7px}
.pv small{font-size:12px;opacity:.7;letter-spacing:.03em}
.seg{display:inline-flex;gap:2px;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:inherit;padding:6px 15px;border-radius:999px;font-size:12.5px;font-weight:500;letter-spacing:.04em;transition:background .3s,color .3s}
.seg button[aria-pressed="true"]{background:var(--porcelain);color:var(--ink)}

/* ---------- VITRINE ---------- */
.s-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 41px);z-index:30;background:var(--porcelain);border-bottom:1px solid transparent;transition:background .5s,border-color .5s}
.s-head.scrolled{background:rgba(246,246,243,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-color:var(--line)}
.s-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.mono{width:40px;height:40px;border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:18px}
.brand b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.04em;line-height:1}
.brand small{display:block;margin-top:6px;font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-3)}
.ig{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;letter-spacing:.03em;color:var(--ink);text-decoration:none;transition:border-color .3s}
.ig:hover{border-color:var(--ink)}

.hero{margin-top:24px;display:grid;grid-template-columns:1fr 1.15fr;background:var(--white);border-radius:6px;overflow:hidden}
.h-text{display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding:56px}
.h-text .bronze{color:var(--bronze)}
.h-text .count{margin-left:12px;color:var(--ink-3)}
.h-text .br{margin-top:24px;color:var(--ink-2)}
.h-text h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,5.2vw,58px);line-height:1.02;margin-top:8px}
.h-text p.d{margin:20px 0 0;max-width:42ch;color:var(--ink-2);font-weight:300;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.h-cta{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:28px}
.btn-dark{display:inline-flex;align-items:center;gap:12px;border:0;background:var(--ink);color:var(--porcelain);border-radius:5px;padding:14px 24px;font-size:12.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;transition:background .3s}
.btn-dark:hover{background:#2c3036}
.btn-dark svg{transition:transform .35s var(--ease)}
.btn-dark:hover svg{transform:translateX(4px)}
.h-price{font-family:var(--f-display);font-size:26px}
.thumbs{display:flex;gap:10px}
.thumb-b{position:relative;width:44px;height:56px;border:0;padding:0;border-radius:3px;overflow:hidden;background:var(--mist)}
.thumb-b .art{transition:opacity .5s,filter .5s}
.thumb-b[aria-selected="false"] .art{opacity:.5;filter:grayscale(1)}
.thumb-b:hover .art{opacity:.9}
.thumb-b .bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(22,25,29,.1)}
.thumb-b .bar i{display:block;height:100%;background:var(--ink);transform-origin:left;animation:prog linear both}
.h-img{position:relative;border:0;padding:0;background:var(--mist);min-height:600px;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transform:scale(1.06);transition:opacity 1.4s var(--ease),transform 1.4s var(--ease)}
.slide.on{opacity:1;transform:scale(1)}
.art{position:absolute;inset:0;width:100%;height:100%;display:block}

.cat-h{scroll-margin-top:130px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin:96px 0 40px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.cat-h .bronze{color:var(--bronze)}
.cat-h h2{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,5vw,48px);line-height:1.05;margin-top:8px}
.search{position:relative;width:min(100%,320px)}
.search svg{position:absolute;left:0;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 8px 12px 28px;outline:none;transition:border-color .3s}
.search input:focus{border-color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:48px 24px}
.card{display:block;width:100%;border:0;background:none;padding:0;text-align:left}
.ph{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:3px;overflow:hidden;background:var(--mist)}
.ph .zoom{position:absolute;inset:0;transition:transform 1.2s var(--ease)}
.card:hover .ph .zoom{transform:scale(1.05)}
.card.off .zoom{filter:grayscale(1);opacity:.6}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);transition:transform 1.1s var(--ease);pointer-events:none}
.card:hover .ph::after{transform:translateX(120%)}
.ph .promo{position:absolute;left:12px;top:12px;background:rgba(246,246,243,.92);border-radius:999px;padding:4px 10px;font-size:9px}
.ph .more{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:center;background:rgba(246,246,243,.94);border-radius:3px;padding:8px 12px;font-size:12px;letter-spacing:.04em;opacity:0;transform:translateY(8px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.card:hover .more{opacity:1;transform:none}
.card .b{display:block;margin-top:16px;font-size:10px;color:var(--ink-3)}
.card .n{display:block;margin-top:4px;font-family:var(--f-display);font-size:20px;line-height:1.3}
.av{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;font-weight:500;letter-spacing:.03em;color:var(--ok)}
.av::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.av.no{color:var(--ink-3)}
.empty{text-align:center;color:var(--ink-2);font-weight:300;padding:80px 0}
.s-foot{margin-top:112px;border-top:1px solid var(--line);text-align:center;padding-block:40px}
.s-foot p{margin:0}
.s-foot small{display:block;margin-top:8px;color:var(--ink-3);font-size:12px}

/* janela do perfume */
.ov{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:32px;transition:opacity .28s}
.ov.closing{opacity:0}
.ov .bg{position:absolute;inset:0;background:rgba(22,25,29,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .5s var(--ease) both}
.pm{position:relative;display:flex;width:100%;max-width:900px;max-height:90vh;background:var(--porcelain);border-radius:10px;overflow:hidden;box-shadow:0 30px 80px -20px rgba(22,25,29,.35);animation:sheet .45s var(--ease) both;transition:transform .3s}
.ov.closing .pm{transform:translateY(24px)}
.pm .pi{position:relative;width:52%;flex-shrink:0;min-height:560px;background:var(--mist);overflow:hidden}
.pm .pi .art{animation:settle 1.1s var(--ease) both}
.pm .pt{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto;padding:48px 40px 40px}
.pm .pt>*{animation:rise .7s var(--ease) both}
.pm h3{font-family:var(--f-display);font-weight:400;font-size:42px;line-height:1.08;margin-top:8px}
.meta{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:20px;color:var(--ink-2);font-size:14px}
.price{margin:24px 0 0;font-family:var(--f-display);font-size:30px}
.desc{margin:24px 0 0;padding-top:24px;border-top:1px solid var(--line);color:var(--ink-2);font-weight:300;max-width:52ch}
.order{margin-top:auto;padding-top:36px}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--ink);color:var(--porcelain);border-radius:5px;padding:16px 24px;font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;transition:background .3s}
.wa-btn:hover{background:#2c3036}
button.wa-btn{width:100%;border:0;font-family:inherit;cursor:pointer}
button.ig{background:none;font-family:inherit;cursor:pointer}
.wa-btn .dot{width:28px;height:28px;border-radius:50%;background:var(--wa);color:#fff;display:grid;place-items:center;transition:transform .3s var(--ease)}
.wa-btn:hover .dot{transform:scale(1.1)}
.wa-btn.outline{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.wa-btn.outline:hover{background:var(--ink);color:var(--porcelain)}
.nf{max-width:440px;margin:0 auto;padding:64px 0;text-align:center}
.nf p{margin:0;font-size:24px;line-height:1.3}
.nf>span{display:block;margin:12px 0 28px;color:var(--ink-2);font-weight:300}
.nf .wa-btn{max-width:360px;margin:0 auto}
.nf .clear{margin-top:20px;border:0;background:none;color:var(--ink-2);font-size:14px;text-underline-offset:4px}
.nf .clear:hover{color:var(--ink);text-decoration:underline}
.wa-off{display:flex;justify-content:center;border:1px solid var(--line);border-radius:5px;padding:16px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);cursor:not-allowed}
.order small{display:block;text-align:center;margin-top:12px;color:var(--ink-3);font-size:12px}
.xbtn{position:absolute;right:12px;top:12px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.08);display:grid;place-items:center;transition:transform .35s var(--ease)}
.xbtn:hover{transform:rotate(90deg)}

/* ---------- PAINEL ---------- */
.a-head{background:var(--white);border-bottom:1px solid var(--line)}
.a-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.a-head b{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.03em;line-height:1.1}
.a-head small{display:block;margin-top:4px;font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-3)}
.acts{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:5px;padding:10px 16px;font-size:13.5px;font-weight:500;letter-spacing:.03em;border:1px solid transparent;transition:all .3s;white-space:nowrap;text-decoration:none}
.btn.pri{background:var(--ink);color:var(--porcelain)}
.btn.pri:hover{background:#2c3036}
.btn.gh{background:var(--white);border-color:var(--line);color:var(--ink)}
.btn.gh:hover{border-color:var(--ink)}
.btn.dg{background:var(--white);border-color:rgba(163,58,50,.3);color:var(--danger)}
.btn.dg:hover{background:var(--danger);color:#fff}
.btn.dgf{background:var(--danger);color:#fff}
.btn.sm{padding:7px 12px;font-size:12px}
.a-main{padding-block:40px 96px}
.a-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.a-top h1{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1}
.a-top p{margin:8px 0 0;font-size:14px;color:var(--ink-2)}
.field{width:100%;border:1px solid var(--line);background:var(--white);border-radius:5px;padding:10px 14px;outline:none;transition:border-color .3s}
.field:focus{border-color:var(--ink)}
.field::placeholder{color:var(--ink-3)}
.lab{display:block;margin-bottom:6px;font-size:12px;font-weight:500;letter-spacing:.03em;color:var(--ink-2)}
.plist{list-style:none;margin:16px 0 0;padding:0;background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.plist li{display:flex;align-items:center;gap:16px;padding:16px 20px;border-top:1px solid var(--line);animation:rise .7s var(--ease) both}
.plist li:first-child{border-top:0}
.pthumb{position:relative;width:52px;height:64px;flex-shrink:0;border-radius:3px;overflow:hidden;background:var(--mist)}
.pinfo{flex:1;min-width:0}
.pinfo .b{font-size:9.5px;color:var(--ink-3)}
.pinfo .n{display:block;font-family:var(--f-display);font-size:18px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinfo .m{font-size:12px;color:var(--ink-2)}
.pctl{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:flex-end}
.sw{display:inline-flex;align-items:center;gap:10px;border:0;background:none;padding:0;font-size:13px;color:var(--ink-2)}
.sw .tr{position:relative;width:38px;height:22px;border-radius:999px;background:var(--stone);transition:background .3s}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:transform .3s var(--ease)}
.sw[aria-checked="true"] .tr{background:var(--ink)}
.sw[aria-checked="true"] .tr::after{transform:translateX(16px)}
.btns{display:flex;gap:6px}

/* janelas do painel */
.am{position:relative;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;background:var(--white);border-radius:10px;box-shadow:0 30px 80px -20px rgba(22,25,29,.35);animation:sheet .45s var(--ease) both}
.am.small{max-width:380px}
.am header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line)}
.am header h3{font-family:var(--f-display);font-weight:400;font-size:20px}
.am .xs{width:36px;height:36px;border:0;border-radius:50%;background:none;display:grid;place-items:center;color:var(--ink-2)}
.am .xs:hover{background:var(--mist)}
.am .bd{padding:20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.am footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{display:flex;align-items:center;gap:16px;width:100%;border:1px dashed var(--line);border-radius:8px;padding:12px;background:none;text-align:left;transition:border-color .3s,background .3s}
.drop:hover,.drop.drag{border-color:var(--ink)}
.drop.drag{background:var(--mist)}
.drop .dp{position:relative;width:76px;height:96px;flex-shrink:0;border-radius:3px;overflow:hidden;background:var(--mist)}
.drop .dp img{width:100%;height:100%;object-fit:cover;animation:fade .5s both}
.drop b{display:block;font-weight:500;font-size:14px}
.drop span{display:block;margin-top:2px;font-size:12px;color:var(--ink-3)}
.prefix{position:relative}
.prefix span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--ink-3)}
.prefix .field{padding-left:40px}
.flags{display:flex;gap:12px 32px;flex-wrap:wrap;background:rgba(236,235,230,.6);border-radius:8px;padding:14px 16px}
.err{margin:0;border:1px solid rgba(163,58,50,.2);border-radius:5px;padding:9px 12px;color:var(--danger);font-size:14px}
.hint{margin:6px 0 0;font-size:12px;color:var(--ink-3)}
/* acordes principais */
@keyframes accord{from{width:0}to{width:var(--w)}}
.acc{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.acc .t{margin:0;font-size:10px;color:var(--ink-3)}
.acc ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.acc li{height:26px}
.bar-a{display:flex;align-items:center;height:100%;width:var(--w);border-radius:0 999px 999px 0;padding-left:12px;overflow:hidden;white-space:nowrap;font-size:12.5px;font-weight:500;letter-spacing:.04em;animation:accord .9s var(--ease) both}
.bar-a span{animation:fade .5s var(--ease) both}
.ae-head{display:flex;justify-content:space-between;align-items:baseline}
.ae-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ae-list li{display:flex;align-items:center;gap:10px}
.ae-track{position:relative;flex:1;height:26px}
.ae-track .fill{position:absolute;inset:0 auto 0 0;display:flex;align-items:center;padding-left:12px;border-radius:0 999px 999px 0;font-size:12px;font-weight:500;letter-spacing:.04em;white-space:nowrap;pointer-events:none;transition:width .15s}
.ae-track input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.ae-x{width:28px;height:28px;flex-shrink:0;border:0;border-radius:50%;background:none;color:var(--ink-3);display:grid;place-items:center}
.ae-x:hover{background:var(--mist);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--white);border-radius:999px;padding:4px 10px 4px 6px;font-size:12px;color:var(--ink-2);transition:border-color .3s,color .3s}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chip i{width:12px;height:12px;border-radius:50%}
/* ---------- simulação WhatsApp / Instagram (somente demonstração) ---------- */
.demo{position:fixed;inset:0;z-index:85;display:flex;align-items:center;justify-content:center;gap:40px;padding:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.demo .bg{position:absolute;inset:0;background:rgba(22,25,29,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .4s var(--ease) both}
.demo-side{position:relative;max-width:300px;color:#f6f6f3;animation:rise .7s var(--ease) both}
.demo-side .caps{color:#cdb48f;margin:0}
.demo-side h3{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.1;margin-top:10px}
.demo-side p{margin:14px 0 0;color:rgba(246,246,243,.78);font-weight:300}

const parseBRL=s=>{const t=String(s).replace(/[^\d,.]/g,"");if(!t)return null;const n=t.includes(",")?t.replace(/\./g,"").replace(",","."):(/\.\d{3}$/.test(t)?t.replace(/\./g,""):t);const v=Number(n);return isFinite(v)&&v>=0?Math.round(v*100):null};

/* Acordes (mesma lista e cores do site) */
const ACCORDS=[["amadeirado","Amadeirado","#7b5b3e"],["citrico","Cítrico","#e8dc78"],["aromatico","Aromático","#6fa199"],["especiado-fresco","Especiado fresco","#a9c77c"],["especiado-quente","Especiado quente","#b4643f"],["atalcado","Atalcado","#ebe2d4"],["almiscarado","Almiscarado","#dcd5e2"],["frutado","Frutado","#e69a82"],["iris","Íris","#c8c2dc"],["canela","Canela","#d29a6c"],["verde","Verde","#86b089"],["ambar","Âmbar","#c58a3f"],["baunilha","Baunilha","#eedcb2"],["couro","Couro","#6a4a3a"],["floral","Floral","#e7bac6"],["aquatico","Aquático","#8fc2d3"],["fresco","Fresco","#bcdde0"],["doce","Doce","#e6a9b4"],["lavanda","Lavanda","#a89ac8"],["oud","Oud","#4f3c34"],["tabaco","Tabaco","#8a6542"],["defumado","Defumado","#8c8985"],["terroso","Terroso","#8b7b5d"],["herbal","Herbal","#9bb48b"],["patchouli","Patchouli","#6f6a45"],["mineral","Mineral","#b3b9bd"]].map(([key,label,color])=>({key,label,color}));

const MAX_ACC=10;
function textOn(hex){const n=parseInt(hex.slice(1),16);const l=[(n>>16)&255,(n>>8)&255,n&255].map(c=>{c/=255;return c<=.03928?c/12.92:((c+.055)/1.055)**2.4});return .2126*l[0]+.7152*l[1]+.0722*l[2]>.3?"#16191d":"#ffffff"}

function closeLayer(animate){const ov=$("#layer .ov");if(!ov)return;const done=()=>{$("#layer").innerHTML="";document.body.style.overflow=""};if(animate){ov.classList.add("closing");setTimeout(done,280)}else done()}

function promos(){return products.filter(p=>p.promo)}
function renderHero(full){
  const items=promos(),box=$("#hero");if(!box)return;
  clearTimeout(slideT);
  if(!items.length){box.innerHTML="";return}
  if(slide>=items.length)slide=0;
  const c=items[slide],many=items.length>1;
  if(full||!box.querySelector(".hero")||box.querySelectorAll(".slide").length!==items.length){
    box.innerHTML=`<section class="hero" aria-roledescription="carrossel" aria-label="Promoções"><div class="h-text"><div id="htxt"></div><div class="thumbs" id="thumbs" role="tablist" aria-label="Escolher promoção"></div></div>
    <button class="h-img" id="himg" aria-label="Ver detalhes">${items.map((p,i)=>`<div class="slide${i===slide?" on":""}" aria-hidden="${i!==slide}">${art(p,"h")}</div>`).join("")}</button></section>`;
    const sec=box.querySelector(".hero");
    const setPlay=()=>{const bar=box.querySelector(".bar i");if(bar)bar.style.animationPlayState=paused?"paused":"running"};
    sec.addEventListener("mouseenter",()=>{paused=true;setPlay()});
    sec.addEventListener("mouseleave",()=>{paused=false;setPlay()});
  }
  box.querySelectorAll(".slide").forEach((s,i)=>{s.classList.toggle("on",i===slide);s.setAttribute("aria-hidden",i!==slide)});
  $("#himg").dataset.p=c.id;$("#himg").setAttribute("aria-label","Ver "+c.name);
  const pad=n=>String(n).padStart(2,"0");
  $("#htxt").innerHTML=`<p class="caps bronze rise" style="margin:0">Promoção${many?`<span class="count num">${pad(slide+1)} / ${pad(items.length)}</span>`:""}</p>
    <p class="caps br rise" style="animation-delay:90ms;margin-bottom:0">${esc(c.brand)}</p>
    <h1 class="rise" style="animation-delay:150ms">${esc(c.name)}</h1>
    <p class="d rise" style="animation-delay:220ms">${esc(c.desc)}</p>
    <div class="h-cta rise" style="animation-delay:290ms"><button class="btn-dark" data-p="${c.id}">Ver detalhes ${ARROW}</button>${c.price?`<span class="h-price num">${brl(c.price)}</span>`:""}</div>`;
  const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  $("#thumbs").innerHTML=many?items.map((p,i)=>`<button class="thumb-b" role="tab" aria-selected="${i===slide}" aria-label="${esc(p.name)}" data-slide="${i}">${art(p,"t")}<span class="bar">${i===slide?(reduced?'<i style="animation:none"></i>':`<i style="animation-duration:${SLIDE_MS}ms;animation-play-state:${paused?"paused":"running"}"></i>`):""}</span></button>`).join(""):"";
  // a barra de progresso comanda a troca: pausar a barra pausa o carrossel no ponto exato
  const bar=$("#thumbs .bar i");
  if(bar&&!reduced)bar.addEventListener("animationend",()=>{slide=(slide+1)%promos().length;renderHero()},{once:true});
}

let draftImg=null,draftAcc=[];

  box.innerHTML=`<div class="ae-head"><span class="lab" style="margin:0">Acordes principais</span><span class="num" style="font-size:11px;color:var(--ink-3)">${draftAcc.length}/${MAX_ACC}</span></div>
  ${draftAcc.length?`<ul class="ae-list">${draftAcc.map(a=>{const c=ACC[a.k];return `<li><div class="ae-track"><span class="fill" style="width:${accW(a.v)}%;background:${c.color};color:${textOn(c.color)}">${c.label}</span><input type="range" min="10" max="100" step="5" value="${a.v}" data-acc="${a.k}" aria-label="Intensidade de ${c.label}"></div><button type="button" class="ae-x" data-acc-x="${a.k}" aria-label="Remover ${c.label}">${X}</button></li>`}).join("")}</ul>`:""}

function saveForm(id){
  const err=m=>$("#f-err").innerHTML=`<p class="err">${esc(m)}</p>`;

    av:$('[data-act="f-av"]').getAttribute("aria-checked")==="true",promo:$('[data-act="f-promo"]').getAttribute("aria-checked")==="true"};
  if(id){Object.assign(products.find(x=>x.id===+id),data);toast("Perfume atualizado.")}
  else{const pal=[["#eeedea","#d9d6cd","#5a4a38","#151619"],["#eaedee","#cfd6da","#2f4a5c","#e3e3e0"],["#edede8","#d7d7cc","#3e4d3a","#1a1a1a"]];products.unshift({id:++pid,...data,c:pal[pid%3]});toast("Perfume cadastrado.")}

}

function demoWhatsApp(msg){
  lastDemo=()=>demoWhatsApp(msg);
  closeDemo();document.body.style.overflow="hidden";
  const kind=/não encontrei/.test(msg)?"search":/indisponível/.test(msg)?"order":"buy";
  const reply={buy:"Olá! Tudo ótimo, obrigado pelo contato 🙂\nTemos sim, pronta entrega. Posso separar o seu?",
    order:"Olá! Conseguimos encomendar sim 🙂\nJá te passo o prazo e o valor certinho.",
    search:"Olá! Conseguimos sim 🙂\nMe confirma o tamanho em ml que você prefere?"}[kind];
  $("#demo").innerHTML=`<div class="demo" role="dialog" aria-modal="true" aria-label="Simulação do WhatsApp"><div class="bg" data-demo-close></div>
    ${side("Como funciona","O cliente cai direto na sua conversa","Um toque no botão abre o WhatsApp do "+esc(settings.name)+" com a mensagem já escrita, com o nome do perfume. É só ele enviar.",true)}
    ${phoneShell("wa-scr",`<div class="wa-top"><span class="back">‹</span><span class="wa-av">${esc(settings.name.charAt(0))}</span><span><b>${esc(settings.name)} Perfumaria</b><small id="wa-st">online</small></span></div>
      <div class="wa-body" id="wa-body"><span class="wa-day">HOJE</span><span class="wa-sec">Conta comercial · As mensagens vêm do catálogo do site</span></div>
      <div class="wa-input"><div class="wa-field" id="wa-field"></div><span class="wa-send" id="wa-send">${SEND}</span></div>`)}
  </div>`;
  const field=$("#wa-field"),body=$("#wa-body"),st=$("#wa-st");
  const add=(cls,html)=>{const b=document.createElement("div");b.className="bub "+cls;b.innerHTML=html;body.appendChild(b);body.scrollTop=body.scrollHeight;return b};
  const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduced){add("out",`${esc(msg)}<span class="meta2">${hhmm()} ${TICKS.replace('class="ticks"','class="ticks read"')}</span>`);add("in",`${esc(reply)}<span class="meta2">${hhmm()}</span>`);return}
  // 1) digitando a mensagem pronta
  const steps=28;for(let i=1;i<=steps;i++)later(()=>{field.textContent=msg.slice(0,Math.ceil(msg.length*i/steps))},500+i*42);
  const tSend=500+steps*42+500;
  // 2) envia
  later(()=>{$("#wa-send").classList.add("press")},tSend-120);
  later(()=>{$("#wa-send").classList.remove("press");field.textContent="";add("out",`${esc(msg)}<span class="meta2">${hhmm()} ${TICKS}</span>`)},tSend);
  // 3) lida
  later(()=>{const t=body.querySelector(".bub.out:last-of-type .ticks");t&&t.classList.add("read")},tSend+1000);
  // 4) loja digitando e responde
  let typing;
  later(()=>{st.textContent="digitando…";st.classList.add("typing");typing=add("in",'<span class="dots"><i></i><i></i><i></i></span>')},tSend+1700);
  later(()=>{typing&&typing.remove();st.textContent="online";st.classList.remove("typing");add("in",`${esc(reply)}<span class="meta2">${hhmm()}</span>`)},tSend+3600);
}

function tourStart(){
  tour.on=true;tour.paused=false;document.body.classList.add("tour-on");
  $("#tour").innerHTML=`<div class="t-block"></div><div class="t-spot" id="t-spot" style="left:50%;top:50%;width:0;height:0"></div><div class="t-card bottom" id="t-card" role="dialog" aria-live="polite" aria-label="Apresentação guiada"></div>`;
  goStep(0);loop();
}
function stepCleanup(){tour.timers.forEach(clearTimeout);tour.timers=[];if(tour.cleanup){tour.cleanup();tour.cleanup=null}}
function goStep(i){
  stepCleanup();
  if(i>=STEPS.length){tourEnd(true);return}
  tour.i=Math.max(0,i);const st=STEPS[tour.i];
  st.run();
  if(!st.noAutoScroll)tLater(()=>{const sels=st.el();const el=sels.map(s=>$(s)).find(Boolean);if(!el)return;const r=el.getBoundingClientRect();if(r.top<60||r.bottom>innerHeight-20)el.scrollIntoView({behavior:"smooth",block:"center"})},450);
  renderCard();
}
function renderCard(){
  const st=STEPS[tour.i],n=STEPS.length,pad=x=>String(x).padStart(2,"0");
  $("#t-card").innerHTML=`<div class="t-prog"><i id="t-bar" style="animation-duration:${st.dur}ms;animation-play-state:${tour.paused?"paused":"running"}"></i></div>
    <div class="t-in"><p class="caps t-step anim">Etapa ${pad(tour.i+1)} de ${pad(n)}</p><h4 class="anim" style="animation-delay:60ms">${st.t}</h4><p class="tx anim" style="animation-delay:120ms">${st.x()}</p>
    <div class="t-ctl"><div class="t-dots" aria-hidden="true">${STEPS.map((_,k)=>`<i class="${k===tour.i?"on":k<tour.i?"done":""}"></i>`).join("")}</div>
    <div class="t-btns"><button class="t-exit" data-tour="exit">Sair</button><button class="t-ic" data-tour="prev" aria-label="Etapa anterior" ${tour.i===0?"disabled":""}>${PREV}</button><button class="t-ic" data-tour="pause" aria-label="${tour.paused?"Continuar":"Pausar"}">${tour.paused?PLAY:PAUSE}</button><button class="t-ic pri" data-tour="next" aria-label="Próxima etapa">${NEXT}</button></div></div></div>`;
  $("#t-bar").addEventListener("animationend",()=>{if(tour.on&&!tour.paused)goStep(tour.i+1)},{once:true});
}
function setPaused(v){tour.paused=v;const b=$("#t-bar");if(b)b.style.animationPlayState=v?"paused":"running";const pb=$('[data-tour="pause"]');if(pb){pb.innerHTML=v?PLAY:PAUSE;pb.setAttribute("aria-label",v?"Continuar":"Pausar")}}
function loop(){
  if(!tour.on)return;
  const spot=$("#t-spot"),card=$("#t-card");
  if(spot&&card){
    const rects=STEPS[tour.i].el().flatMap(s=>Array.from(document.querySelectorAll(s)).slice(0,1)).map(e=>e.getBoundingClientRect()).filter(r=>r.width>0&&r.height>0);
    if(rects.length){
      const pad=10,vw=innerWidth,vh=innerHeight;
      let L=Math.min(...rects.map(r=>r.left))-pad,T=Math.min(...rects.map(r=>r.top))-pad,R=Math.max(...rects.map(r=>r.right))+pad,B=Math.max(...rects.map(r=>r.bottom))+pad;
      L=Math.max(L,6);T=Math.max(T,6);R=Math.min(R,vw-6);B=Math.min(B,vh-6);
      Object.assign(spot.style,{left:L+"px",top:T+"px",width:Math.max(0,R-L)+"px",height:Math.max(0,B-T)+"px",opacity:1});
      const ch=card.offsetHeight,below=vh-B,above=T;
      const pos=below>=ch+28?"bottom":above>=ch+70?"top":"bottom";
      if(!card.classList.contains(pos)){card.classList.remove("top","bottom");card.classList.add(pos)}
    }else spot.style.opacity=0;
  }
  tour.raf=requestAnimationFrame(loop);
}
function tourEnd(showEnd){
  stepCleanup();tour.on=false;cancelAnimationFrame(tour.raf);document.body.classList.remove("tour-on");
  closeDemo();closeLayer(false);resetSearch();
  if(!$("#store").hidden)scrollTo({top:0});else show("store");
  $("#tour").innerHTML="";
  if(showEnd)cover("end");
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-tour]");if(!b)return;
  const a=b.dataset.tour;
  if(a==="begin")hideCover(tourStart);
  else if(a==="close")hideCover(()=>{show("store")});
  else if(a==="exit")tourEnd(false);
  else if(a==="next")goStep(tour.i+1);
  else if(a==="prev")goStep(tour.i-1);
  else if(a==="pause")setPaused(!tour.paused);
},true);
document.addEventListener("keydown",e=>{
  if(!tour.on)return;
  if(e.key==="Escape"){e.stopImmediatePropagation();tourEnd(false)}
  else if(e.key==="ArrowRight"){e.preventDefault();goStep(tour.i+1)}
  else if(e.key==="ArrowLeft"){e.preventDefault();goStep(tour.i-1)}
  else if(e.key===" "){e.preventDefault();setPaused(!tour.paused)}
},true);
$("#tour-start").addEventListener("click",()=>{if(tour.on)tourEnd(false);cover("start")});
if(location.hash!=="#painel")cover("start");
})();
</script>
